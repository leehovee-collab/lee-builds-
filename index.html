<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lee's Builds</title>
<meta name="description" content="A scrapbook of the tools, bots and brands Lee has built with Claude.">
<meta name="theme-color" content="#3D1220">
<meta property="og:title" content="Lee's Builds">
<meta property="og:description" content="A scrapbook of the tools, bots and brands Lee has built with Claude.">
<meta property="og:image" content="images/herbal/range.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,700;1,900&family=Jost:wght@300;400;500;700&family=Caveat:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=2">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='3' y='3' width='26' height='26' rx='3' fill='%23FBF8F3' transform='rotate(-6 16 16)'/%3E%3Crect x='7' y='6' width='18' height='15' fill='%233D1220' transform='rotate(-6 16 16)'/%3E%3Crect x='10' y='1' width='12' height='5' fill='%23D9A441' opacity='.85'/%3E%3C/svg%3E">
</head>
<body>
<a class="skip" href="#about">Skip to about me</a>

<div id="page">
  <!-- HERO: the kraft folder with the polaroid ring -->
  <header class="hero">
    <div class="orbit" id="orbit">
      <div class="centre">
        <div class="folder">
          <span class="folder-note" aria-hidden="true"></span>
          <span class="clip" aria-hidden="true"></span>
          <h1 class="title"><span class="a" id="t-top">Lee's</span><span class="b" id="t-bottom">Builds</span></h1>
          <span class="tagline" id="t-tagline">Tools, bots &amp; brands</span>
        </div>
      </div>

      <ul class="ring" id="ring" aria-label="Builds"></ul>

      <svg class="sticker spark" style="left:7%;top:12%;width:30px" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 0C13 8 16 11 24 12 16 13 13 16 12 24 11 16 8 13 0 12 8 11 11 8 12 0Z"/></svg>
      <svg class="sticker spark" style="left:14%;top:19%;width:16px" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 0C13 8 16 11 24 12 16 13 13 16 12 24 11 16 8 13 0 12 8 11 11 8 12 0Z"/></svg>
      <svg class="sticker gold" style="right:8%;top:72%;width:26px" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 0C13 8 16 11 24 12 16 13 13 16 12 24 11 16 8 13 0 12 8 11 11 8 12 0Z"/></svg>
      <svg class="sticker heart" style="left:8%;bottom:18%;width:36px;transform:rotate(-10deg)" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 21s-8-5.3-8-11a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 20 10c0 5.7-8 11-8 11z"/><circle cx="9" cy="10" r="1.3" fill="#3D1220"/><circle cx="14" cy="10" r="1.3" fill="#3D1220"/></svg>
      <svg class="sticker heart" style="right:11%;top:11%;width:26px;transform:rotate(14deg)" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 21s-8-5.3-8-11a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 20 10c0 5.7-8 11-8 11z"/></svg>

      <div class="hint">
        <p id="t-hint">Drag to spin · Tap a build</p>
        <button class="pause" id="pause" type="button" aria-pressed="false">Pause spin</button>
      </div>
    </div>
  </header>

  <main>
    <!-- ABOUT ME -->
    <section class="about grain" id="about" tabindex="-1" aria-labelledby="about-hi">
      <div class="wrap">
        <div class="about-stage">
          <figure class="me me1"><span class="tape"></span><div class="me-pic" id="me1"></div><figcaption id="cap1"></figcaption></figure>
          <div class="bubble">
            <h2 class="hi" id="about-hi"></h2>
            <div id="about-text"></div>
            <p class="ps" id="about-ps"></p>
          </div>
          <figure class="me me2"><span class="tape dots"></span><div class="me-pic" id="me2"></div><figcaption id="cap2"></figcaption></figure>
        </div>
        <div class="about-row">
          <div class="made" id="about-made"></div>
          <aside class="pinboard">
            <span class="tape"></span>
            <h3 id="cur-title"></h3>
            <ul id="cur-list"></ul>
          </aside>
        </div>
      </div>
    </section>

    <!-- ALL BUILDS -->
    <section class="index" aria-labelledby="all-title">
      <div class="wrap">
        <h2 class="h-serif" id="all-title"></h2>
        <ul class="list" id="list"></ul>
      </div>
    </section>
  </main>

  <footer id="footer"></footer>
</div>

<!-- A BUILD PAGE (filled in when a polaroid is tapped) -->
<div id="detail" hidden role="dialog" aria-modal="true" aria-labelledby="d-title">
  <div class="dbar"><button class="dbtn" id="dclose" type="button">← All builds</button><span class="dname" id="dname"></span></div>
  <div id="dbody"></div>
</div>

<noscript><p class="noscript">This scrapbook needs JavaScript switched on to open the builds.</p></noscript>

<script src="content.js?v=2"></script>
<script src="js/herbal-viewer.js?v=2"></script>
<script src="js/orbit.js?v=2"></script>
</body>
</html>
